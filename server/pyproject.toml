[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaforge-api"
version = "0.1.0"
description = "Local HTTP API for the SchemaForge CLI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyYAML>=6,<7",
  "sqlparse>=0.5,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["schemaforge_api*"]
